<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我只在乎你</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./common.js" defer></script>
  <script src="./dialogs.js" defer></script>
  <script src="./gallery.js" defer></script>
  <script src="./plans.js" defer></script>
  <script src="./library.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">A</span>
        <div>
          <h1>我只在乎你</h1>
          <p>自主心跳 · 计划 · 作品</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="live" class="pill">连接中</span>
        <button id="refresh" class="btn-ghost" type="button">刷新</button>
      </div>
    </header>

    <div id="notice" class="notice" hidden>
      <span id="notice-text"></span>
      <button id="notice-close" class="btn-ghost btn-small" type="button">关闭</button>
    </div>

    <nav class="tabs" role="tablist" aria-label="页面导航">
      <button class="tab active" data-tab="overview" role="tab" aria-selected="true">概览</button>
      <button class="tab" data-tab="plans" role="tab" aria-selected="false">计划</button>
      <button class="tab" data-tab="works" role="tab" aria-selected="false">作品</button>
      <button class="tab" data-tab="activity" role="tab" aria-selected="false">记录</button>
      <button class="tab" data-tab="settings" role="tab" aria-selected="false">设置</button>
    </nav>

    <main>
      <section id="overview" class="view">
        <div id="metrics" class="stats">
          <div class="stat"><span class="stat-icon skeleton" style="width:36px;height:36px"></span><div class="grow"><b class="skeleton" style="display:block;width:48px;height:24px"></b><span class="skeleton" style="display:block;width:64px;height:14px;margin-top:4px"></span></div></div>
          <div class="stat"><span class="stat-icon skeleton" style="width:36px;height:36px"></span><div class="grow"><b class="skeleton" style="display:block;width:48px;height:24px"></b><span class="skeleton" style="display:block;width:64px;height:14px;margin-top:4px"></span></div></div>
          <div class="stat"><span class="stat-icon skeleton" style="width:36px;height:36px"></span><div class="grow"><b class="skeleton" style="display:block;width:48px;height:24px"></b><span class="skeleton" style="display:block;width:64px;height:14px;margin-top:4px"></span></div></div>
          <div class="stat"><span class="stat-icon skeleton" style="width:36px;height:36px"></span><div class="grow"><b class="skeleton" style="display:block;width:48px;height:24px"></b><span class="skeleton" style="display:block;width:64px;height:14px;margin-top:4px"></span></div></div>
        </div>
        <section class="panel">
          <div class="panel-head">
            <div><h2>陪伴对象</h2><p class="hint">每个对象的运行状态与下次自主判断。</p></div>
            <button id="open-settings" class="btn-ghost" type="button">管理对象</button>
          </div>
          <div id="sessions" class="list"></div>
        </section>
        <section class="panel">
          <div class="panel-head">
            <div><h2>今日与免打扰</h2><p class="hint">预算、发送尝试与暂停控制。</p></div>
            <label class="inline-field">对象<select id="overview-target"></select></label>
          </div>
          <div id="usage" class="panel-body stack"></div>
        </section>
        <details class="panel">
          <summary><span>运行自检</span><span class="hint">平台、会话、人格与模型</span></summary>
          <div class="panel-body">
            <div class="actions"><button id="diagnose" type="button">开始自检</button></div>
            <div id="diagnostics-result" class="stack"></div>
          </div>
        </details>
      </section>

      <section id="plans" class="view" hidden>
        <div class="view-head">
          <div><h2>计划</h2><p class="hint">当前任务、持续项目与自主节奏。</p></div>
          <label class="inline-field">对象<select id="plans-target"></select></label>
        </div>
        <div id="plans-content" class="stack"></div>
      </section>

      <section id="works" class="view" hidden>
        <div class="view-head">
          <div><h2>作品</h2><p class="hint">点开条目后才加载图片或正文。</p></div>
          <label class="inline-field">对象<select id="works-target"></select></label>
        </div>
        <div id="work-filters" class="toolbar"></div>
        <div id="works-content" class="stack"></div>
      </section>

      <section id="activity" class="view" hidden>
        <div class="view-head">
          <div><h2>记录</h2><p class="hint">最近决策、行动与诊断。</p></div>
          <label class="inline-field">对象<select id="activity-target"></select></label>
        </div>
        <div id="activity-content" class="stack"></div>
      </section>

      <section id="settings" class="view" hidden>
        <div class="view-head">
          <div><h2>设置</h2><p class="hint">填写对象 QQ 号并保存，即持续运行。</p></div>
          <button id="save-settings" class="btn-primary" form="config-form" type="submit">保存设置</button>
        </div>
        <form id="config-form"><div id="config-fields"></div></form>
      </section>
    </main>

    <footer>
      <span>我只在乎你 · 1.10</span>
      <span id="updated">等待首次更新</span>
    </footer>
  </div>
</body>
</html>
